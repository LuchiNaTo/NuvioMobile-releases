name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF##*/}"
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $tag (version: $version, prerelease: $is_prerelease)"

  ios:
    name: iOS release
    runs-on: macos-latest
    needs: prepare
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      - name: Patch MPVKit Package.swift for CI
        run: |
          set -euo pipefail
          cd MPVKit
          python3 - << 'PYEOF'
          import re

          replacements = {
              "Libplacebo": (
                  "https://github.com/mpvkit/libplacebo-build/releases/download/7.360.1/Libplacebo.xcframework.zip",
                  "2fa3d54cb81f302d6f11c7b2f509af30944381c3b11ee9d35096eb4637a6e2dd"
              ),
              "Libavcodec": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libavcodec.xcframework.zip",
                  "22af1a028043c1953cae8cc8b9d632da8d8c733364dc896242010457e2601905"
              ),
              "Libavdevice": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libavdevice.xcframework.zip",
                  "b1ba57380014e7680918a5f9f9d52cf91883f600ba1d53857f3720494de91c99"
              ),
              "Libavformat": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libavformat.xcframework.zip",
                  "ded64005204d4af754273ffe11e69a91752f8a6a1c64f4540205e1666698e317"
              ),
              "Libavfilter": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libavfilter.xcframework.zip",
                  "aedda48ffcb27e461e962af7ad7e92be736dca82943cb18dee9e4fec756b0aa4"
              ),
              "Libavutil": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libavutil.xcframework.zip",
                  "947c31241e317e21e20e7ac0c24c467541d383b6ab88bd42acccc5947e1a674f"
              ),
              "Libswresample": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libswresample.xcframework.zip",
                  "3832feceb12606ac342dd93219ae1ca2f4bcabf037ab9299cb5b633060a34248"
              ),
              "Libswscale": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libswscale.xcframework.zip",
                  "ed201cdae3c8e8262f3d9f3618cf3de552db47e607e39d45f93eb336ed05a075"
              ),
              "Libmpv": (
                  "https://github.com/mpvkit/MPVKit/releases/download/0.41.0-n8.1/Libmpv.xcframework.zip",
                  "b4d0a9ef26abd7bbf1e0a386902206deddaeae5cd36a8ab1ba638c5327389ca7"
              ),
          }

          with open("Package.swift", "r") as f:
              content = f.read()

          for name, (url, checksum) in replacements.items():
              pattern = (
                  r'(\.binaryTarget\(\s*\n\s*name:\s*"' + re.escape(name) + r'",\s*\n)'
                  r'\s*path:\s*"[^"]+"\s*\n'
                  r'(\s*\))'
              )
              replacement = (
                  r'\g<1>'
                  f'            url: "{url}",\n'
                  f'            checksum: "{checksum}"\n'
                  r'\g<2>'
              )
              new_content, count = re.subn(pattern, replacement, content)
              if count:
                  print(f"Patched {name}")
                  content = new_content
              else:
                  print(f"Skipped {name}")

          with open("Package.swift", "w") as f:
              f.write(content)

          print("Done patching MPVKit Package.swift")
          PYEOF

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL=${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL=${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      - name: Raise Gradle heap for Kotlin/Native release link
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" << 'EOF'
          org.gradle.jvmargs=-Xmx10g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
          kotlin.daemon.jvmargs=-Xmx4g
          EOF
          ./gradlew --stop || true

      - name: Build iOS app
        run: |
          set -euo pipefail
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package iOS app into IPA
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd iosApp/build/Build/Products/Release-iphoneos

          if [[ ! -d "Nuvio.app" ]]; then
            echo "::error::Nuvio.app not found"
            ls -la
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R Nuvio.app Payload/

          ipa_name="Nuvio-${VERSION}-ios.ipa"
          zip -q -r "$ipa_name" Payload

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          mv "$ipa_name" "$GITHUB_WORKSPACE/artifacts/$ipa_name"
          ls -la "$GITHUB_WORKSPACE/artifacts"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android release
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    outputs:
      built: ${{ steps.android_result.outputs.built }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL=${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL=${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          EOF

      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            keystore_path="$RUNNER_TEMP/nuvio-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"
            store_password="$KEYSTORE_PASSWORD"
            key_alias="$KEY_ALIAS"
            key_password="$KEY_PASSWORD"
            echo "Using release keystore from secrets."
          else
            echo "::warning::Release signing secrets not set — generating an ephemeral debug-style keystore so the build can complete. APKs will not be installable over signed production builds."
            keystore_path="$RUNNER_TEMP/nuvio-fallback.keystore"
            store_password="android"
            key_alias="androiddebugkey"
            key_password="android"
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias "$key_alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          {
            echo ""
            echo "NUVIO_RELEASE_STORE_FILE=$keystore_path"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$store_password"
            echo "NUVIO_RELEASE_KEY_ALIAS=$key_alias"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$key_password"
          } >> local.properties

      - name: Build and stage Android APK artifacts
        id: android_artifacts
        continue-on-error: true
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          ./gradlew \
            :androidApp:assembleFullRelease \
            -Pnuvio.android.distribution=full \
            -Pnuvio.splitAbi=true \
            --stacktrace

          ./gradlew \
            :androidApp:assemblePlaystoreRelease \
            -Pnuvio.android.distribution=playstore \
            -Pnuvio.splitAbi=true \
            --stacktrace

          mkdir -p artifacts

          for flavor in full playstore; do
            out_dir="androidApp/build/outputs/apk/${flavor}/release"

            for abi in arm64-v8a armeabi-v7a x86_64; do
              src=$(find "$out_dir" -maxdepth 1 -type f -name "*.apk" | grep -- "-${abi}-release" | head -n1 || true)

              if [[ -z "$src" ]]; then
                echo "::error::Missing APK for ${flavor}/${abi}"
                ls -la "$out_dir" || true
                exit 1
              fi

              dest="artifacts/Nuvio-${VERSION}-android-${flavor}-${abi}.apk"
              cp "$src" "$dest"
              echo "$src -> $dest"
            done
          done

          ls -la artifacts/

      - name: Upload Android APK artifacts
        id: android_upload
        if: steps.android_artifacts.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Mark Android availability
        id: android_result
        if: always()
        run: |
          if [[ "${{ steps.android_artifacts.outcome }}" == "success" && "${{ steps.android_upload.outcome }}" == "success" ]]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, ios, android]
    if: ${{ always() && needs.ios.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/

      - name: Download Android artifacts if available
        if: ${{ needs.android.outputs.built == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: release-assets/

      - name: List release assets
        run: ls -la release-assets/

      - name: Compose release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
          ANDROID_BUILT: ${{ needs.android.outputs.built }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/${TAG}"

          link() {
            local file="$1"
            local label="$2"
            if [[ -f "release-assets/$file" ]]; then
              printf '[%s](%s/%s)' "$label" "$base" "$file"
            else
              printf '—'
            fi
          }

          {
            echo "## Nuvio ${VERSION}"
            echo
            echo "### Downloads"
            echo
            echo "| Architecture | Android (Full) | Android (Play Store) | iOS |"
            echo "| --- | --- | --- | --- |"
            printf '| arm64 | %s | %s | %s |\n' \
              "$(link "Nuvio-${VERSION}-android-full-arm64-v8a.apk" "APK")" \
              "$(link "Nuvio-${VERSION}-android-playstore-arm64-v8a.apk" "APK")" \
              "$(link "Nuvio-${VERSION}-ios.ipa" "IPA")"
            printf '| armeabi-v7a | %s | %s | — |\n' \
              "$(link "Nuvio-${VERSION}-android-full-armeabi-v7a.apk" "APK")" \
              "$(link "Nuvio-${VERSION}-android-playstore-armeabi-v7a.apk" "APK")"
            printf '| x86_64 | %s | %s | — |\n' \
              "$(link "Nuvio-${VERSION}-android-full-x86_64.apk" "APK")" \
              "$(link "Nuvio-${VERSION}-android-playstore-x86_64.apk" "APK")"
            echo
            echo "### Notes"
            echo
            echo "- The iOS .ipa is unsigned. Install with AltStore, Sideloadly, or another sideloading tool."
            if [[ "${ANDROID_BUILT}" != "true" ]]; then
              echo "- Android artifacts were not produced by this run, but the iOS release was published successfully."
            else
              echo "- Android artifacts were produced successfully."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nuvio ${{ needs.prepare.outputs.version }}"
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true